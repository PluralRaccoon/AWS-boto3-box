[project]
name = "aws-boto3-box"
version = "0.1.0"
description = "A place to learn, practice, master and have fun with python's library boto3 to automate staff in AWS."
authors = [
    {name = "Carlos Pizarro",email = "pizarro.c.barboza@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3 (>=1.44.11,<2.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
